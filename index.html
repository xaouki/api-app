<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Fiverr Gig Factory — generate Fiverr gig ideas quickly." />
  <title>Fiverr Gig Factory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <header class="header">
        <h1>Fiverr Gig Factory</h1>
      </header>

      <div class="settings">
        <label>
          <span>Category:</span>
          <select id="category">
            <option>Web Development</option>
            <option>AI Websites</option>
            <option>SaaS</option>
            <option>Landing Pages</option>
            <option>Chrome Extensions</option>
            <option>API Integration</option>
            <option>Android Apps</option>
          </select>
        </label>

        <label>
          <span>Number of Gigs:</span>
          <input id="count" type="number" min="1" max="20" value="20" />
        </label>

        <label>
          <span>Price range:</span>
          <div class="price-row">
            <input id="minPrice" type="number" value="25" min="5" aria-label="Minimum price" />
            <span> - </span>
            <input id="maxPrice" type="number" value="150" min="10" aria-label="Maximum price" />
          </div>
        </label>

        <button id="generate" class="generate">GENERATE GIGS</button>
      </div>

      <div class="divider"></div>

      <section class="results-section">
        <div class="result-title">
          <span>Generated:</span>
          <strong id="status">0</strong>
          <button id="clear" class="text-btn">Clear</button>
        </div>
        <div id="results" class="results empty">
          <p>Click <b>GENERATE GIGS</b> to create your list.</p>
        </div>
      </section>

      <div class="footer-actions">
        <button id="export" class="export">Export JSON</button>
      </div>

      <p class="note">Draft generator only — prepare your Fiverr listings here, then publish them manually on Fiverr.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
