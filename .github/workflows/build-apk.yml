name: Build Maine SMS API Sender APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-sender/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-sender
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" output/Maine-SMS-API-Sender.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maine-SMS-API-Sender
          path: android-sender/output/Maine-SMS-API-Sender.apk
          if-no-files-found: error
          retention-days: 30
