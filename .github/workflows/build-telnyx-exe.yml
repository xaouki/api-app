name: Build Telnyx Bulk SMS Sender EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'Telnyx-Bulk-SMS-Sender/**'
      - '.github/workflows/build-telnyx-exe.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r Telnyx-Bulk-SMS-Sender/requirements.txt

      - name: Build EXE
        run: pyinstaller --onefile --console --name Telnyx-Bulk-SMS-Sender Telnyx-Bulk-SMS-Sender/main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telnyx-Bulk-SMS-Sender-Windows
          path: dist/Telnyx-Bulk-SMS-Sender.exe
          if-no-files-found: error
