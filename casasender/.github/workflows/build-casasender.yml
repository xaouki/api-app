name: Build CasaSender EXE
on:
  push:
    branches: [ casasender-exe ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r casasender/requirements.txt
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CasaSender casasender/CasaSender.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CasaSender-v2.0-Windows
          path: dist/CasaSender.exe
